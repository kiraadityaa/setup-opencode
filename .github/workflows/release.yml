name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION matches tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION file ($FILE_VERSION) does not match tag (v$TAG_VERSION)"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            git log --oneline --no-merges "$PREV_TAG..$GITHUB_REF_NAME" > /tmp/changelog.txt
          else
            git log --oneline --no-merges > /tmp/changelog.txt
          fi
          echo "log<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "setup-opencode ${{ steps.version.outputs.tag }}" \
            --notes "$(cat <<'CHANGELOG'
            ## Changelog

            ${{ steps.changelog.outputs.log }}

            ## Install

            One-command setup:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/kiraadityaa/setup-opencode/main/setup.sh | bash
            ```
            CHANGELOG
            )"